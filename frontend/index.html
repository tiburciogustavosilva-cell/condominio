<!DOCTYPE html>
<html lang="pt-br">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#F4F7FB" />
    <link rel="icon" type="image/png" href="/brand/emblema.png" />
    <title>Áquila Condomínios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <script>
      // padrão é o claro; escuro só se o usuário escolheu no menu (aplicado antes do React, sem piscar)

        if (localStorage.getItem("tema") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
