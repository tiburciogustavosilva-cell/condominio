# Sobe o sistema inteiro: banco, API e frontend.
# Variáveis (arquivo .env na raiz, ao lado deste compose):
#   POSTGRES_PASSWORD  senha do Postgres (obrigatória)
#   JWT_SECRET         chave dos tokens (obrigatória; gere com: openssl rand -hex 32)
#   APP_URL            endereço do frontend, usado no link de convite (padrão http://localhost:8080)
#   VITE_API_URL       endereço da API vista pelo navegador (padrão http://localhost:4000/api)
#   SMTP_*             opcional: sem SMTP_HOST os e-mails são só simulados no log
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: aquila
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aquila"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/aquila
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
