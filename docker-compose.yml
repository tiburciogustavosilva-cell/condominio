# Básico pra subir no Portainer: API e frontend, usando as imagens publicadas no GHCR.
# O banco Postgres fica fora deste compose; a conexão vem de DATABASE_URL.
# Variáveis (preencha na Stack do Portainer):
#   DATABASE_URL       ex.: postgresql://usuario:senha@host:5432/aquila (obrigatória)
#   JWT_SECRET         chave dos tokens (obrigatória; gere com: openssl rand -hex 32)
#   APP_URL            endereço do frontend, usado no link de convite (padrão http://localhost:8080)
#   SMTP_*             opcional: sem SMTP_HOST os e-mails são só simulados no log
services:
  backend:
    image: ghcr.io/tiburciogustavosilva-cell/condominio-backend:latest
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "4000:4000"
    networks: [aquilaNet]
    restart: unless-stopped

  frontend:
    image: ghcr.io/tiburciogustavosilva-cell/condominio-frontend:latest
    ports:
      - "8080:80"
    networks: [aquilaNet]
    depends_on:
      - backend
    restart: unless-stopped

networks:
  aquilaNet:
    name: aquilaNet
